name: CI

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tokens/**'
      - 'dist/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]

jobs:
  build-site:
    name: Build docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        working-directory: site
        run: pnpm install

      - name: Build
        working-directory: site
        run: pnpm build
