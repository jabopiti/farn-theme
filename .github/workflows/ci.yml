name: CI

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tokens/**'
      - 'dist/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-site:
    name: Build docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify dist/farn-tokens.css is up-to-date
        run: |
          cat tokens/colors.css tokens/typography.css tokens/spacing.css \
              tokens/motion.css tokens/dark-light.css tokens/components.css > /tmp/farn-tokens-rebuilt.css
          if ! diff -q dist/farn-tokens.css /tmp/farn-tokens-rebuilt.css > /dev/null; then
            echo "dist/farn-tokens.css is out of sync with tokens/. Rebuild:"
            echo "  cat tokens/colors.css tokens/typography.css tokens/spacing.css tokens/motion.css tokens/dark-light.css tokens/components.css > dist/farn-tokens.css"
            diff dist/farn-tokens.css /tmp/farn-tokens-rebuilt.css
            exit 1
          fi

      - name: Verify dist/farn.css is up-to-date
        run: |
          cat dist/farn-tokens.css tokens/base.css > /tmp/farn-rebuilt.css
          if ! diff -q dist/farn.css /tmp/farn-rebuilt.css > /dev/null; then
            echo "dist/farn.css is out of sync with dist/farn-tokens.css. Rebuild:"
            echo "  cat dist/farn-tokens.css tokens/base.css > dist/farn.css"
            diff dist/farn.css /tmp/farn-rebuilt.css
            exit 1
          fi

      - name: Verify dist/farn-components.css is up-to-date
        run: |
          cat tokens/components.css tokens/component-classes.css > /tmp/farn-components-rebuilt.css
          if ! diff -q dist/farn-components.css /tmp/farn-components-rebuilt.css > /dev/null; then
            echo "dist/farn-components.css is out of sync with tokens/. Rebuild:"
            echo "  cat tokens/components.css tokens/component-classes.css > dist/farn-components.css"
            diff dist/farn-components.css /tmp/farn-components-rebuilt.css
            exit 1
          fi

      - name: Verify dist/farn-typography.css is up-to-date
        run: |
          cat tokens/typography-classes.css > /tmp/farn-typography-rebuilt.css
          if ! diff -q dist/farn-typography.css /tmp/farn-typography-rebuilt.css > /dev/null; then
            echo "dist/farn-typography.css is out of sync with tokens/typography-classes.css. Rebuild:"
            echo "  cat tokens/typography-classes.css > dist/farn-typography.css"
            diff dist/farn-typography.css /tmp/farn-typography-rebuilt.css
            exit 1
          fi

      - name: Verify dist/tabs.js is up-to-date
        run: |
          if ! diff -q dist/tabs.js site/src/scripts/tabs.js > /dev/null; then
            echo "dist/tabs.js is out of sync with site/src/scripts/tabs.js. Rebuild:"
            echo "  cp site/src/scripts/tabs.js dist/tabs.js"
            exit 1
          fi

      - name: Verify site/public/llms.txt matches root llms.txt
        run: |
          if ! diff -q llms.txt site/public/llms.txt > /dev/null; then
            echo "site/public/llms.txt is out of sync with llms.txt. Rebuild:"
            echo "  cp llms.txt site/public/llms.txt"
            diff llms.txt site/public/llms.txt
            exit 1
          fi

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: site/package.json
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: site
        run: pnpm build
