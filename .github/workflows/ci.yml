name: CI

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tokens/**'
      - 'dist/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]

jobs:
  build-site:
    name: Build docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: cd site && pnpm install

      - name: Build
        run: cd site && pnpm build
