name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Verify CHANGELOG entry
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          ESCAPED="${VERSION//./\\.}"
          if ! grep -qE "^## \[?${ESCAPED}\]?" CHANGELOG.md; then
            echo "ERROR: No CHANGELOG.md entry for version ${VERSION}."
            echo "Add a '## [${VERSION}]' section before tagging."
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/farn.css
            dist/farn-tokens.css
            dist/farn-components.css
            dist/farn-typography.css
            dist/tabs.js
          body: |
            See [CHANGELOG.md](https://github.com/jabopiti/farn-theme/blob/main/CHANGELOG.md) for what changed.

            **CDN (jsDelivr):**
            ```html
            <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/gh/jabopiti/farn-theme@${{ github.ref_name }}/dist/farn.css">
            ```

  publish-npm:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Publish to npm
        run: npm publish
