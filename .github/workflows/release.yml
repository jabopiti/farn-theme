name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify CHANGELOG entry
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          ESCAPED="${VERSION//./\\.}"
          if ! grep -qE "^## \[?${ESCAPED}\]?" CHANGELOG.md; then
            echo "ERROR: No CHANGELOG.md entry for version ${VERSION}."
            echo "Add a '## [${VERSION}]' section before tagging."
            exit 1
          fi

      - name: Rebuild dist/farn.css
        run: |
          cat tokens/colors.css \
              tokens/typography.css \
              tokens/spacing.css \
              tokens/dark-light.css \
              tokens/base.css \
            > dist/farn.css

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/farn.css
          body: |
            See [CHANGELOG.md](https://github.com/jabopiti/farn-theme/blob/main/CHANGELOG.md) for what changed.

            **CDN (jsDelivr):**
            ```html
            <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/gh/jabopiti/farn-theme@${{ github.ref_name }}/dist/farn.css">
            ```
